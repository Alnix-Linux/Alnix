name: Build ISO

# Builds the Alnix bootable ISO with mkarchiso and uploads it as an artifact.
#
# This is an expensive build: it compiles Calamares (and friends) from the AUR
# inside a chroot and then produces a full live image. It therefore does NOT run
# on every push or pull request -- fast checks live in the separate `ci.yml`
# workflow. This workflow only runs when manually triggered or when a release
# tag (v*) is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Serialize ISO builds and never cancel an in-progress one: a release build is
  # far too expensive to interrupt partway through.
  group: build-iso
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The ISO, the build chroot, and the AUR package builds are large, so
          # reclaim space taken by unused preinstalled toolchains on the runner.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Get AUR package versions
        id: aur
        shell: bash
        run: |
          set -euo pipefail
          # Cache key for the local repository: the AUR recipes' current
          # commits plus today's date. The date keeps a cached Calamares from
          # outliving the Arch libraries it was compiled against, so the cache
          # only saves time when the workflow is re-run on the same day.
          eval "$(grep '^aur_packages=' build-repo.sh)"
          heads=$(for pkg in "${aur_packages[@]}"; do
            git ls-remote "https://aur.archlinux.org/${pkg}.git" HEAD | cut -f1
          done | sha256sum | cut -c1-16)
          echo "key=alnix-repo-$(date -u +%F)-${heads}-${{ hashFiles('build-repo.sh', 'alnix/pacman.conf') }}" >> "$GITHUB_OUTPUT"

      - name: Restore local package repository
        uses: actions/cache@v4
        with:
          path: repo
          key: ${{ steps.aur.outputs.key }}

      - name: Build ISO in privileged Arch Linux container
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work \
            -w /work \
            archlinux:latest \
            bash -c '
              set -euo pipefail

              # The container must run with --privileged because build-repo.sh
              # bind-mounts its chroot onto itself (`mount --bind`), uses
              # `pacstrap`, and enters the chroot with `arch-chroot`; all of
              # these require CAP_SYS_ADMIN. Everything runs as root (the
              # container default), which build-iso.sh/build-repo.sh require.

              # Initialize the Arch keyring, then refresh it before installing
              # anything so package signatures verify (the image ships a stale
              # keyring).
              pacman-key --init
              pacman-key --populate archlinux

              # Update, and install the tools required by the build scripts.
              pacman -Syu --noconfirm --needed \
                archiso arch-install-scripts git base-devel

              # Builds repo/x86_64 (Calamares etc., from the AUR) on first run
              # and then the ISO into out/.
              bash ./build-iso.sh
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnix-iso
          path: out/*.iso
          if-no-files-found: error
          # The ISO is already compressed; zipping it again only costs time.
          compression-level: 0
          retention-days: 14
