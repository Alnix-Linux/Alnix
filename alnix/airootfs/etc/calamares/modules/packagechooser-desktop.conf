---
# The item id is handed to apply-choices so check shellprocess-choices.conf
# Screenshots are looked up in branding/alnix/
mode: required
method: legacy
labels:
    step: "Desktop"
default: plasma
items:
    - id: plasma
      name: "KDE Plasma"
      description: "The Alnix desktop. Already on this image, so no internet connection is needed."
      screenshot: "desktop-plasma.png"
    - id: gnome
      name: "GNOME"
      description: "A simple, focused desktop. Downloaded during installation, so an internet connection is needed."
      screenshot: "desktop-gnome.png"
    - id: xfce
      name: "Xfce"
      description: "A lightweight, traditional desktop for older or slower computers. Downloaded during installation, so an internet connection is needed."
      screenshot: "desktop-xfce.png"
