---
# The new system's /etc/resolv.conf points into /run, which is an empty tmpfs
# during installation. Give it the live session's DNS settings so pacman can
# reach the mirrors in apply-choices.
dontChroot: true
timeout: 30
script:
    - "mkdir -p ${ROOT}/run/systemd/resolve && cp -L /etc/resolv.conf ${ROOT}/run/systemd/resolve/stub-resolv.conf"
