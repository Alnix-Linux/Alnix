---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "splash" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    # The theme needs the graphical terminal.
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_THEME: "/usr/share/grub/themes/alnix/theme.txt"
    GRUB_DISABLE_RECOVERY: true
    # Detect Windows and other systems for dual boot.
    GRUB_DISABLE_OS_PROBER: false
always_use_defaults: true
