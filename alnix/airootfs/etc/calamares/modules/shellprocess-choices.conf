---
# Applies the Desktop, Theme and yay pages also The values are the item ids
# chosen in the packagechooser-*.conf pages
dontChroot: false
# Installing GNOME or Xfce downloads and upgrades a lot of packages
timeout: 3600
# Not verbose: verbose output only goes to the log, and then the error
# dialog has nothing to show when the script fails.
verbose: false
script:
    - "/usr/lib/alnix-installer/apply-choices ${gs[packagechooser_desktop]} ${gs[packagechooser_theme]} ${gs[packagechooser_yay]}"
